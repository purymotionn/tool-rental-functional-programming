[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-rental"
version = "0.1.0"
description = "Учебная система аренды строительных инструментов"
requires-python = ">=3.11"

[project.scripts]
tool-rental = "tool_rental.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

